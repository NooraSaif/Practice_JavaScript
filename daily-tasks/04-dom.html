<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- youtub subscriptions-->
  <h5>YouTube subscriptions</h5>
  <button id="subscribeButton" onclick="
  toggleSubscription()
  " >Subscribe</button>
  <p id="subscriptionCount">0</p>

  <br>

  <h5>Calculator</h5>
  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">
  <button onclick="
  calculationResult()
  ">Calculate</button>
  <p id="result"></p>

  <br>

  <h5>Calculator Amount</h5>
  <input id="calcShapping" placeholder="Enter your total amount">
  <button onclick="
  calculationShapping()
  ">Calculate</button>
  <!-- <button onkeydown="
  keydownEventHandler(event)
  ">Calculate</button> -->
  <p id="total"></p>

  <script>
    function calculationShapping() {
      const getAmount = document.getElementById('calcShapping');
      const userInput = Number(getAmount.value);

      if (userInput < 50) {
        result = userInput + 5;
      }

      document.getElementById('total').textContent = `Total amount: ${result}`;
    }

    // function keydownEventHandler(event) {
    //   if (event.key === 'Enter') {
    //     calculationShapping();
    //   }
    // }

    function calculationResult() {
      const getNum1 = document.getElementById('num1'); 
      const getNum2 = document.getElementById('num2');

      const userInput1 = Number(getNum1.value);
      const userInput2 = Number(getNum2.value);

      let result =  userInput1 + userInput2;

      document.getElementById('result').textContent = `${result}`;
    }

    function toggleSubscription() {
      const subscribeButton = document.getElementById('subscribeButton');
      const subscriptionCount = document.getElementById('subscriptionCount');

      if (subscribeButton.textContent === 'Subscribe') {
        subscribeButton.textContent = 'Subscribed';
        subscriptionCount.textContent = parseInt(subscriptionCount.textContent) + 1;
      } else {
        subscribeButton.textContent = 'Subscribe';
        subscriptionCount.textContent = parseInt(subscriptionCount.textContent) - 1;
      }
    }

  </script>
</body>
</html>
