<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip Game</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #11111d);
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        color: #f8f8f2;
      }

      button {
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #6272a4;
        color: #ffffff;
        transition: all 0.2s ease-in-out;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      button:hover {
        background-color: #bd93f9;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(189, 147, 249, 0.3);
      }

      #resultDisplay {
        font-size: 1.1rem;
        color: #f1fa8c;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>

    <h2>Guess the Result of the flip!</h2>
    <button onclick="playGame('Heads')">Heads</button>
    <button onclick="playGame('Tails')">Tails</button>
    
    <h3 id="resultDisplay">Select Heads or Tails to flip!</h3>

    <script>
      function playGame(userGuess) {
        // 1. Generate random coin
        let randomNumber = Math.floor(Math.random() * 2);
        let coinResult = randomNumber === 0 ? 'Heads' : 'Tails';

        // 2. Compare guess and result
        let message = '';
        if (userGuess === coinResult) {
          message = `You chose ${userGuess}. The coin landed on ${coinResult}. You Win! 🎉`;
        } else {
          message = `You chose ${userGuess}. The coin landed on ${coinResult}. You Lose! ❌`;
        }

        // 3. Display result 
        document.getElementById('resultDisplay').textContent = message;
      }
    </script>
  </body>
</html>
