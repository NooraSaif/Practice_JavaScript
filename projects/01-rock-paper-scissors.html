<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Rock Paper Scissor Game</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #3f4a88;
      color: white;
      font-weight: bold;
    }
  </style>
  <body>
    <h3>Chose your move</h3>

    <!-- Rock button -->
    <button onclick="

      const computerChoice = computerPlay();
      const result = playRound('Rock', computerChoice);

      ">Rock</button>

    <!-- Paper button -->
    <button onclick="
      const computerChoice2 = computerPlay();
      const result2 = playRound('Paper', computerChoice2);
    
      ">Paper</button>

    <!-- Scissor button -->
    <button onclick="

      const computerChoice3 = computerPlay();
      const result3 = playRound('Scissor', computerChoice3);

      ">Scissor</button>

    <!-- reset button -->
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score'); // this will display null value
      ">Reset</button>

    <script>  
      // Initialize score in localStorage if not present
      let score = JSON.parse(localStorage.getItem('score'));

      if (score === null) {
        score = { wins: 0, losses: 0, ties: 0 };
      }

      /* 
      shortcut using not
        if (!score) {
          score = { wins: 0, losses: 0, ties: 0 };
        }

      shortcut using or ||
        let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0 };
      */

      function computerPlay() { 
        
        const randomNumber = Math.floor(Math.random() * 3);

        let computerChoice = '';

        if (randomNumber === 0) {
          computerChoice = 'Rock';
        } else if (randomNumber === 1) {
          computerChoice = 'Paper';
        } else {
          computerChoice = 'Scissor';
        }

        return computerChoice;
      }

      function playRound(playerSelection, computerSelection) {
        
        let result = '';

        if (playerSelection === computerSelection) {
          result = 'Tie';
        } else if (
          (playerSelection === 'Rock' && computerSelection === 'Scissor') ||
          (playerSelection === 'Paper' && computerSelection === 'Rock') ||
          (playerSelection === 'Scissor' && computerSelection === 'Paper')
        ) {
          result = 'You win';
        } else {
          result = 'You lose';
        }

        if (result === 'You win') {
          score.wins++;
        } else if (result === 'You lose') {
          score.losses++;
        } else if (result === 'Tie') {
          score.ties++;
        }

        // save the score result in localStorage
        // .setItem('name ', 'string value');
        localStorage.setItem('score', JSON.stringify(score));

        alert(`You chose: ${playerSelection} \n Computer chose: ${computerSelection} \n result: ${result} \n score: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }

    </script>

  </body>
</html>
