<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Rock Paper Scissor Game</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #3f4a88;
      color: white;
      font-weight: bold;
    }
  </style>
  <body>
    <h3>Chose your move</h3>

    <!-- Rock button -->
    <button onclick="

      const computerChoice = computerPlay();
      const result = playRound('Rock', computerChoice);

      alert('You chose: Rock \n Computer chose: ' + computerChoice + '\n Result: ' + result);
      ">Rock</button>

    <!-- Paper button -->
    <button onclick="
      const computerChoice2 = computerPlay();
      const result2 = playRound('Paper', computerChoice2);
    
      
      alert('You chose: Paper \n Computer chose: ' + computerChoice2 + '\n result: ' + result2);
      ">Paper</button>

    <!-- Scissor button -->
    <button onclick="

      const computerChoice3 = computerPlay();
      const result3 = playRound('Scissor', computerChoice3);

      alert('You chose: Scissor \n Computer chose: ' + computerChoice3 + '\n result: ' + result3);

      ">Scissor</button>


    <script>  

      function computerPlay() { 
        
        const randomNumber = Math.floor(Math.random() * 3);

        let computerChoice = '';

        if (randomNumber === 0) {
          computerChoice = 'Rock';
        } else if (randomNumber === 1) {
          computerChoice = 'Paper';
        } else {
          computerChoice = 'Scissor';
        }

        return computerChoice;
      }

      function playRound(playerSelection, computerSelection) {
        
        let result = '';

        if (playerSelection === computerSelection) {
          result = 'Tie';
        } else if (
          (playerSelection === 'Rock' && computerSelection === 'Scissor') ||
          (playerSelection === 'Paper' && computerSelection === 'Rock') ||
          (playerSelection === 'Scissor' && computerSelection === 'Paper')
        ) {
          result = 'You win';
        } else {
          result = 'You lose';
        }

        return result;
      }

    </script>

  </body>
</html>
