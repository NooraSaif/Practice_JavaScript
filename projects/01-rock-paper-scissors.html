<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Rock Paper Scissor Game</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #3f4a88;
      color: white;
      font-weight: bold;
    }
  </style>
  <body>
    <h3>Chose your move</h3>

    <!-- Rock button -->
    <button onclick="
      const computerChoice = computerPlay();
      playRound('Rock', computerChoice);
      scoreResult();
      ">Rock</button>

    <!-- Paper button -->
    <button onclick="
      const computerChoice2 = computerPlay();
      playRound('Paper', computerChoice2);
      scoreResult();
      ">Paper</button>

    <!-- Scissor button -->
    <button onclick="
      const computerChoice3 = computerPlay();
      playRound('Scissor', computerChoice3);
      scoreResult();
      ">Scissor</button>

    <p id="scoreResult">Score: win:0 lose:0 tie:0</p>
    <p id="gameResult">Choose a move to start playing.</p>

    <!-- reset button -->
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.setItem('score', JSON.stringify(score));
      scoreResult();
      document.getElementById('gameResult').textContent = 'Score reset!';
      ">Reset</button>

      


    <script>  
      // Initialize score in localStorage if not present
      let score = JSON.parse(localStorage.getItem('score'));

      if (score === null) {
        score = { wins: 0, losses: 0, ties: 0 };
      }

      /* 
      shortcut using not
        if (!score) {
          score = { wins: 0, losses: 0, ties: 0 };
        }

      shortcut using or ||
        let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0 };
      */

      function scoreResult() {
        document.getElementById('scoreResult').textContent = `Score: win:${score.wins} lose:${score.losses} tie:${score.ties}`;
      }

      scoreResult();

      function computerPlay() { 
        
        const randomNumber = Math.floor(Math.random() * 3);

        let computerChoice = '';

        if (randomNumber === 0) {
          computerChoice = 'Rock';
        } else if (randomNumber === 1) {
          computerChoice = 'Paper';
        } else {
          computerChoice = 'Scissor';
        }

        return computerChoice;
      }

      function playRound(playerSelection, computerSelection) {
        
        let result = '';

        if (playerSelection === computerSelection) {
          result = 'Tie';
        } else if (
          (playerSelection === 'Rock' && computerSelection === 'Scissor') ||
          (playerSelection === 'Paper' && computerSelection === 'Rock') ||
          (playerSelection === 'Scissor' && computerSelection === 'Paper')
        ) {
          result = 'You win';
        } else {
          result = 'You lose';
        }

        if (result === 'You win') {
          score.wins++;
        } else if (result === 'You lose') {
          score.losses++;
        } else if (result === 'Tie') {
          score.ties++;
        }

        localStorage.setItem('score', JSON.stringify(score));

        document.getElementById('gameResult').textContent = `You chose: ${playerSelection} | Computer chose: ${computerSelection} | Result: ${result}`;
        scoreResult();
      }

    </script>

  </body>
</html>
